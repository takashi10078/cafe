<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050504">
  <title>診断結果｜喫茶・余白</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="result-page">

  <!-- 最初に表示する画面 -->
  <section id="response-screen" class="response-screen" aria-live="polite">
    <p class="eyebrow">ANALYSIS COMPLETE</p>

    <h2>準備ができました。</h2>

    <p>
      あなたのための回答を、そっと用意しました。
    </p>

    <button id="view-result-button" class="primary-button" type="button">
      回答を見る <span>→</span>
    </button>
  </section>


  <!-- ボタンを押した後に表示する画像 -->
  <main class="image-result">

    <img
      id="scary-image"
      src="assets/images/scary.png"
      alt=""
      hidden
    >

    <img
      id="cafe-image"
      src="assets/images/cafe-bg.png"
      alt=""
      hidden
    >

  </main>

  <script src="script.js"></script>

</body>
</html>
